# Machine-readable licensing for every file (https://reuse.software).
# Check with: reuse lint
version = 1
SPDX-PackageName = "yAIst"
SPDX-PackageSupplier = "The yAIst contributors"

# Everything is yAIst's own work under MIT OR Apache-2.0 unless a more
# specific entry below says otherwise.
[[annotations]]
path = "**"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 The yAIst contributors"
SPDX-License-Identifier = "MIT OR Apache-2.0"

# Adapted from the ArtCraft launcher (https://github.com/storytold/craft-launcher),
# MIT OR Apache-2.0. Only code and visual structure; no ArtCraft trademarks.
[[annotations]]
path = ["apps/yaist-gui/src/theme.rs", "apps/yaist-gui/src/widgets.rs"]
precedence = "aggregate"
SPDX-FileCopyrightText = ["2026 ArtCraft Team and the ArtCraft Launcher contributors", "2026 The yAIst contributors"]
SPDX-License-Identifier = "MIT OR Apache-2.0"

[[annotations]]
path = ["assets/fonts/Inter-Variable.ttf", "assets/fonts/OFL-Inter.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2016 The Inter Project Authors (https://github.com/rsms/inter)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["assets/fonts/Archivo-Variable.ttf", "assets/fonts/OFL-Archivo.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2020 The Archivo Project Authors (https://github.com/Omnibus-Type/Archivo)"
SPDX-License-Identifier = "OFL-1.1"

[[annotations]]
path = ["assets/fonts/GeistMono-Variable.ttf", "assets/fonts/OFL-GeistMono.txt"]
precedence = "override"
SPDX-FileCopyrightText = "2024 The Geist Project Authors (https://github.com/vercel/geist-font)"
SPDX-License-Identifier = "OFL-1.1"
