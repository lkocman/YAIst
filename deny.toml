# cargo-deny policy (https://github.com/EmbarkStudios/cargo-deny):
#   cargo deny check licenses
# Keeps the linked crates permissive, so the package License: stays simple.
# Crates offering a copyleft licence as one OR choice (r-efi, self_cell) pass:
# the permissive alternative is taken.
[graph]
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu", "powerpc64le-unknown-linux-gnu", "s390x-unknown-linux-gnu"]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
    "Unlicense",
    "OFL-1.1",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[advisories]
# Vulnerabilities always fail. "Unmaintained" notices only count for crates we
# depend on directly; transitive ones (paste via ratatui, zvariant via zbus)
# are for those upstreams to replace.
unmaintained = "workspace"
