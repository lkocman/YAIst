[workspace]
resolver = "2"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
yaist-core = { path = "crates/yaist-core" }
yaist-modules = { path = "crates/yaist-modules" }
yaist-agent = { path = "crates/yaist-agent" }
yaist-ui = { path = "crates/yaist-ui" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time", "fs", "io-util"] }
zbus = { version = "6", default-features = false, features = ["tokio"] }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
roxmltree = "0.21"
ratatui = "0.30"
eframe = { version = "0.37", default-features = false, features = ["glow", "wayland", "x11", "accesskit"] }
egui = { version = "0.37", default-features = false }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
